[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b2b-sales-web"
version = "1.0.0"
description = "B2B Sales Pipeline Web Application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==3.2.2",
    "python-multipart==0.0.6",
    "sqlalchemy==2.0.25",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "redis==5.0.1",
    "celery==5.3.6",
    "flower==2.0.1",
    "httpx==0.26.0",
    "aiohttp==3.9.1",
    "openai==1.12.0",
    "anthropic==0.18.1",
    "playwright>=1.40.0",
    "beautifulsoup4==4.12.3",
    "lxml>=6.0.0",
    "feedparser==6.0.10",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "dnspython==2.6.0",
    "prometheus-client==0.19.0",
    "sentry-sdk==1.40.0",
    "python-dotenv==1.0.0",
    "python-dateutil==2.8.2",
    "email-validator==2.1.0.post1",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "pytest-cov==4.1.0",
    "faker==22.1.0",
    "black==23.12.1",
    "isort==5.13.2",
    "mypy==1.8.0",
    "pre-commit==3.6.0",
]

[tool.setuptools.packages.find]
where = ["app"]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true